<div class="page-container">
  <header class="page-header page-header-card">
    <div class="page-header__row page-header__row--1">
      <h1 class="page-title">Cadastro Estacionamento</h1>
      <p class="page-subtitle">Cadastre e gerencie os dados do estacionamento.</p>
    </div>
    @if (showStepper()) {
      <div class="page-header__row page-header__row--2">
        <nav class="tabs" role="tablist" aria-label="Etapas do cadastro">
          @for (step of [1, 2, 3]; track step) {
            <button
              type="button"
              class="tab"
              role="tab"
              [class.tab--active]="currentStep === step"
              [attr.aria-selected]="currentStep === step"
              (click)="goToStep(step)"
            >
              {{ getStepLabel(step) }}
            </button>
          }
        </nav>
        <div class="page-header__actions">
          @if (stepService.currentStep() === 1 || stepService.currentStep() === 2) {
            <button type="button" class="btn btn-primary" (click)="onHeaderSalvar()">Salvar</button>
          }
          <a class="btn btn-secondary" routerLink="/app/cadastro/estacionamento">Voltar</a>
        </div>
      </div>
    }
  </header>

  <div class="page-content">
    @if (!showStepper()) {
      <section class="filter-card">
        <div class="filter-row">
          <select
            class="search-filter input-control form-control-dark"
            [ngModel]="toolbar.searchField()"
            (ngModelChange)="setSearchField($event)"
            aria-label="Filtrar busca por"
          >
            <option value="geral">Busca geral</option>
            <option value="cnpj">CNPJ</option>
            <option value="nomeRazaoSocial">Nome / Razão social</option>
            <option value="descricao">Nome fantasia</option>
            <option value="email">E-mail</option>
            <option value="id">ID</option>
          </select>
          <input
            type="text"
            class="search-input input-control form-control-dark filter-row__grow"
            [placeholder]="searchPlaceholder()"
            [ngModel]="toolbar.searchTerm()"
            (ngModelChange)="toolbar.setSearchTerm($event)"
            (keyup.enter)="onBuscar()"
          />
          <button type="button" class="btn btn-secondary" (click)="onBuscar()">Buscar</button>
          <a class="btn btn-primary" routerLink="/app/cadastro/estacionamento/novo">Novo</a>
        </div>
      </section>
    }

    <section class="data-card">
      <div class="tab-panel">
        <router-outlet></router-outlet>
      </div>
    </section>
  </div>
</div>
