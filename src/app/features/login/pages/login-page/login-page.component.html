<div class="login-page">
  <div class="login-page__toolbar">
    <button
      type="button"
      class="theme-switcher__btn"
      (click)="toggleTheme()"
      [attr.aria-pressed]="currentMode() === 'light'"
      [attr.aria-label]="currentMode() === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
    >
      @if (currentMode() === 'dark') {
        <span class="material-symbols-outlined theme-switcher__icon" aria-hidden="true">light_mode</span>
        <span class="theme-switcher__label">Claro</span>
      } @else {
        <span class="material-symbols-outlined theme-switcher__icon" aria-hidden="true">dark_mode</span>
        <span class="theme-switcher__label">Escuro</span>
      }
    </button>
  </div>

  <div class="login-page__stack">
    <img class="login-page__logo" src="/logo-gts-transparent.png" alt="" aria-hidden="true" decoding="async" />

    <div class="card" role="main" aria-labelledby="login-title">
      <div class="login-header">
        <h1 class="title" id="login-title">Entrar</h1>
        <p class="login-card__lead">Informe seu usuário e senha para continuar</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="form">
        <div class="field">
          <label for="username">Usuário</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="Usuário"
            aria-describedby="username-error"
          />
          <div id="username-error" class="error" *ngIf="username?.touched && username?.invalid">
            <small *ngIf="username?.errors?.['required']">Usuário é obrigatório.</small>
            <small *ngIf="username?.errors?.['minlength']">Mínimo de 3 caracteres.</small>
          </div>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Mínimo 5 caracteres"
            aria-describedby="password-error"
          />

          <div class="forgot">
            <a routerLink="/auth/esqueci-senha">Esqueceu a senha?</a>
          </div>

          <div id="password-error" class="error" *ngIf="password?.touched && password?.invalid">
            <small *ngIf="password?.errors?.['required']">Senha é obrigatória.</small>
            <small *ngIf="password?.errors?.['minlength']">Mínimo de 5 caracteres.</small>
          </div>
        </div>

        <button class="btn" type="submit" [disabled]="form.invalid || loading">
          {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</div>
