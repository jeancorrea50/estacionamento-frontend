<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<!-- Desktop: menu fixo (expandido ou recolhido) -->
@if (!nav.celular()) {
  <aside class="shell__side">
    <app-shell-sidebar (abrirBusca)="abrirBusca()" />
  </aside>
}

<!-- Celular: gaveta por cima do conteúdo -->
@if (nav.celular() && nav.gavetaAberta()) {
  <div class="shell__backdrop" (click)="nav.fecharGaveta()" aria-hidden="true"></div>
  <aside
    id="gts-gaveta"
    class="shell__drawer"
    role="dialog"
    aria-modal="true"
    aria-label="Menu"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <app-shell-sidebar (abrirBusca)="abrirBusca()" />
    <button
      type="button"
      class="shell__drawer-close"
      aria-label="Fechar menu"
      (click)="nav.fecharGaveta()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>
  </aside>
}

<div class="shell__main layout-right">
  <app-shell-topbar
    [patio]="patioTopbar()"
    [podeTrocarPatio]="canTrocarEstacionamentoSessao()"
    [usuario]="loggedUsername()"
    [perfil]="selectedContextLabel()"
    [admin]="isAdminUser()"
    [contextos]="contextosTopbar()"
    [contextoAtual]="selectedContextKey()"
    (abrirBusca)="abrirBusca()"
    (trocarPatio)="onTrocarPatio()"
    (trocarContexto)="onAccessContextChange($event)"
    (sair)="sair()"
  />
  <!-- A rolagem das telas fica aqui (telas usam sticky dentro do main-content). -->
  <main id="conteudo" class="main-content shell__content" tabindex="-1">
    <div class="content-container" [class.content-container--full-width]="isFullWidthContent()">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Celular: atalhos das telas mais usadas + "Menu" -->
@if (nav.celular()) {
  <nav class="shell__bottom" aria-label="Atalhos">
    @for (d of nav.destinosMobile(); track d.item.id) {
      <a
        class="shell__tab"
        [routerLink]="d.item.route"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
      >
        <span class="material-symbols-outlined" aria-hidden="true">{{ d.item.icon }}</span>
        <span>{{ d.item.curto ?? d.item.label }}</span>
      </a>
    }
    <button
      type="button"
      class="shell__tab"
      aria-controls="gts-gaveta"
      [attr.aria-expanded]="nav.gavetaAberta()"
      (click)="nav.gavetaAberta.set(true)"
    >
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      <span>Menu</span>
    </button>
  </nav>
}

@if (showEstacionamentoModal()) {
  <app-admin-estacionamento-select-modal
    (selected)="onEstacionamentoSelected()"
    (openEcossistema)="abrirEcossistemaSemPatio()"
  />
}
