<div class="convite-dlg" role="dialog" aria-labelledby="convite-dlg-title">
  <header class="convite-dlg__header">
    <div class="convite-dlg__icon" aria-hidden="true">
      <span class="material-symbols-outlined">send</span>
    </div>
    <div class="convite-dlg__titles">
      <h2 id="convite-dlg-title" class="convite-dlg__title">Convidar Transportadora</h2>
      <p class="convite-dlg__subtitle">
        O responsável receberá um link seguro para concluir o cadastro da transportadora, frota e
        motoristas.
      </p>
    </div>
  </header>

  <form class="convite-dlg__form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <label class="convite-dlg__field">
      <span class="convite-dlg__label">Nome completo do responsável *</span>
      <span class="convite-dlg__input-wrap">
        <span class="material-symbols-outlined convite-dlg__field-ico" aria-hidden="true">person</span>
        <input
          type="text"
          class="convite-dlg__input"
          formControlName="responsavelNome"
          placeholder="Ex.: João Silva de Oliveira"
          autocomplete="name"
          [attr.aria-invalid]="!!fieldError('responsavelNome')"
        />
      </span>
      @if (fieldError('responsavelNome'); as err) {
        <small class="convite-dlg__error">{{ err }}</small>
      }
    </label>

    <label class="convite-dlg__field">
      <span class="convite-dlg__label">CPF do responsável *</span>
      <span class="convite-dlg__input-wrap">
        <span class="material-symbols-outlined convite-dlg__field-ico" aria-hidden="true">badge</span>
        <input
          type="text"
          class="convite-dlg__input"
          formControlName="responsavelCpf"
          appCpfFormat
          placeholder="000.000.000-00"
          inputmode="numeric"
          autocomplete="off"
          [attr.aria-invalid]="!!fieldError('responsavelCpf')"
        />
      </span>
      @if (fieldError('responsavelCpf'); as err) {
        <small class="convite-dlg__error">{{ err }}</small>
      }
    </label>

    <label class="convite-dlg__field">
      <span class="convite-dlg__label">E-mail do responsável *</span>
      <span class="convite-dlg__input-wrap">
        <span class="material-symbols-outlined convite-dlg__field-ico" aria-hidden="true">mail</span>
        <input
          type="email"
          class="convite-dlg__input"
          formControlName="responsavelEmail"
          placeholder="exemplo@empresa.com"
          autocomplete="email"
          [attr.aria-invalid]="!!fieldError('responsavelEmail')"
        />
      </span>
      @if (fieldError('responsavelEmail'); as err) {
        <small class="convite-dlg__error">{{ err }}</small>
      }
    </label>

    <div class="convite-dlg__info" role="note">
      <span class="material-symbols-outlined" aria-hidden="true">info</span>
      <p>
        O responsável receberá um link seguro para concluir o cadastro da transportadora, frota e
        motoristas.
      </p>
    </div>

    @if (erro(); as msg) {
      <p class="convite-dlg__banner" role="alert">{{ msg }}</p>
    }

    <footer class="convite-dlg__actions">
      <button type="button" class="convite-dlg__btn convite-dlg__btn--ghost" (click)="cancelar()" [disabled]="enviando()">
        Cancelar
      </button>
      <button type="submit" class="convite-dlg__btn convite-dlg__btn--primary" [disabled]="enviando() || form.invalid">
        @if (enviando()) {
          Enviando…
        } @else {
          <span class="material-symbols-outlined" aria-hidden="true">send</span>
          Enviar convite
        }
      </button>
    </footer>
  </form>
</div>
