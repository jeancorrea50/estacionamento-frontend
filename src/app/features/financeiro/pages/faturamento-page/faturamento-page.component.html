<div class="faturamento-shell">
  <div class="page-container">

    <header class="page-header page-header-card fat-page-header">
      <div class="fat-page-header__top">
        <div class="fat-page-header__titles">
          <h1 class="page-title">Faturamento</h1>
          <p class="page-subtitle">Controle de faturas, cobranças e recebimentos</p>
        </div>
      </div>
      <nav class="fat-fin-tabs" role="tablist" aria-label="Abas de Faturamento">
        @for (t of tabs; track t.id) {
          <button
            type="button"
            class="fat-fin-tabs__tab"
            [class.tab--active]="activeTab() === t.id"
            role="tab"
            [attr.aria-selected]="activeTab() === t.id"
            (click)="setTab(t.id)"
          >
            {{ t.label }}
          </button>
        }
      </nav>
    </header>

    <div class="fat-fin-tab-body">
      @switch (activeTab()) {
        @case ('visao-geral') {
          <app-faturamento-visao-geral />
        }
        @case ('faturas') {
          <app-faturamento-faturas />
        }
        @case ('fechamentos') {
          <app-faturamento-fechamentos />
        }
        @case ('recebimentos') {
          <app-faturamento-recebimentos />
        }
        @case ('inadimplencia') {
          <app-faturamento-inadimplencia />
        }
        @case ('config-cobranca') {
          <app-faturamento-config-cobranca />
        }
      }
    </div>

  </div>
</div>
