# Deploy na VPS: git pull + docker compose build/up
#
# Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST       ex.: 108.174.145.123
#   VPS_USER       usuário SSH
#   VPS_SSH_KEY    chave privada SSH (PEM completo)
#   VPS_APP_PATH   pasta na VPS, ex.: /opt/apps/estacionamento-frontend
# Opcional:
#   VPS_SSH_PORT   padrão 22

name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches:
      - developer
      - homolog
      - main
      - master

# Serializa deploys na mesma branch. NÃO cancela build em andamento
# (cancel mid-docker deixa o gateway com 502).
concurrency:
  group: deploy-vps-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Validar secrets
        shell: bash
        run: |
          missing=0
          for s in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_PATH; do
            val=$(printenv "$s" || true)
            if [ -z "$val" ]; then
              echo "Secret obrigatório ausente: $s"
              missing=1
            fi
          done
          exit $missing
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Conhecer host da VPS
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 1) git pull
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          ssh -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=30 \
            "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail
             cd '${VPS_APP_PATH}'
             echo '==> Branch: ${BRANCH}'
             git fetch --all --prune
             git checkout '${BRANCH}'
             git pull --ff-only origin '${BRANCH}'
             echo \"==> HEAD: \$(git rev-parse --short HEAD)\"
             echo \"==> free disk:\"
             df -h '${VPS_APP_PATH}' | tail -1
             docker ps --format 'table {{.Names}}\t{{.Status}}' | head -20
            "

      - name: 2) docker compose build
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          echo "==> Início build $(date -u +%H:%M:%SZ) — progresso plain (pode levar 10–20 min)"
          # stdbuf + tee: Action deixa de parecer “vazia” durante o build.
          ssh -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=30 \
            "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail
             cd '${VPS_APP_PATH}'
             export DOCKER_BUILDKIT=1
             export COMPOSE_DOCKER_CLI_BUILD=1
             export BUILDKIT_PROGRESS=plain
             docker builder prune -f --filter until=1h >/dev/null 2>&1 || true
             stdbuf -oL -eL docker compose build --progress=plain 2>&1 | stdbuf -oL -eL tee /tmp/gts-frontend-build.log
             echo '==> docker compose build exit OK'
            "
          echo "==> Build OK $(date -u +%H:%M:%SZ)"

      - name: 3) docker up + restart gateway
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          ssh -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=30 \
            "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail
             cd '${VPS_APP_PATH}'
             echo '==> docker compose up -d'
             docker compose up -d --remove-orphans
             docker compose ps
             if docker ps -a --format '{{.Names}}' | grep -qx 'estacionamento-gateway'; then
               echo '==> Restart estacionamento-gateway (re-resolve IP do front)'
               docker restart estacionamento-gateway
               sleep 3
               docker ps --filter name=estacionamento-gateway --filter name=estacionamento-frontend --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
             fi
             echo '==> Deploy OK'
            "
