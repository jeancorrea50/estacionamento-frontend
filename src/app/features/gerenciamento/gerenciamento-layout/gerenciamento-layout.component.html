<div class="page-container gerenciamento-shell">
  <header class="page-header page-hero gerenciamento-header">
    <div class="page-header__row page-header__row--1 gerenciamento-header__titles">
      <h1 class="page-title gerenciamento-header__title">Gerenciamento</h1>
      <p class="page-subtitle gerenciamento-header__subtitle">
        Central de gestão de menu, perfis e administração do sistema.
      </p>
    </div>
    <div class="page-header__row page-header__row--2">
      <nav class="tabs gerenciamento-tabs" role="tablist" aria-label="Abas de Gerenciamento">
        <a
          routerLink="/app/gerenciamento/menu"
          routerLinkActive="tab--active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="tab gerenciamento-tabs__tab"
          role="tab"
        >
          Menu
        </a>
        <a
          routerLink="/app/gerenciamento/perfil"
          routerLinkActive="tab--active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="tab gerenciamento-tabs__tab"
          role="tab"
        >
          Perfil
        </a>
        <a
          routerLink="/app/gerenciamento/estacionamento"
          routerLinkActive="tab--active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="tab gerenciamento-tabs__tab"
          role="tab"
        >
          Estacionamento
        </a>
      </nav>
    </div>
  </header>

  <div class="page-content content-card gerenciamento-content">
    <router-outlet></router-outlet>
  </div>
</div>
